<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia Entertainment</title>
  <meta name="description" content="Bağımsız teknoloji ve oyun geliştirme. Teknoloji, yazılım ve oyun.">
  <meta property="og:title" content="Mia Entertainment">
  <meta property="og:description" content="Teknolojiyle yeni fikirler hayata geçir.">
  <meta name="theme-color" content="#0a0612">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="mia.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <div id="splash" role="status" aria-live="polite" aria-label="Mia Entertainment açılıyor">
    <img class="splash-logo" src="assets/mia-entertainment.png" alt="Mia Entertainment" onerror="this.remove()">
    <span id="splash-status">Sunucuya bağlanılıyor...</span>
  </div>

  <main id="page" class="hidden">
    <div class="layout">
    <section class="card" id="card">
      <div class="avatar">
        <span class="avatar-fallback">M</span>
        <img src="assets/mia-logo.png" alt="Mia logosu" onerror="this.remove()">
      </div>

      <h1>Mia Entertainment</h1>
      <p class="type"><span id="typed"></span><i class="caret"></i></p>

      <div class="featured" id="featured"></div>

      <nav class="links" id="links" aria-label="Bağlantılar"></nav>

      <footer>© 2026 Mia Entertainment</footer>
    </section>
    <aside class="games-panel" aria-labelledby="games-title">
      <div class="games-heading"><span class="games-kicker">MOLA ZAMANI</span><h2 id="games-title">Mini Oyunlar</h2><p>Birini seç, rekorunu kır.</p></div>
      <div class="game-list" id="mini"></div>
      <div class="games-note">🎮 Küçük oyunlar, büyük rekabet.</div>
    </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
