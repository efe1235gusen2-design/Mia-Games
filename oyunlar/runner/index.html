<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mia Runner · Mia Entertainment</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="stylesheet" href="../../mia.css">
  <link rel="stylesheet" href="../oyun.css">
</head>
<body class="game">
  <a class="back" href="../../">← Geri dön</a>
  <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true">🔊 Ses açık</button>
  <div class="game-wrap">
    <div class="hud">
      <span id="score">Puan: 0</span>
      <span id="level">Seviye 1</span>
      <span id="best">Rekor: 0</span>
    </div>
    <canvas id="g" width="640" height="240"></canvas>
    <div class="pad" id="pad">
      <button data-k="down" class="wide">Eğil</button>
      <button data-k="jump" class="wide">Zıpla</button>
    </div>
    <p class="hint">Boşluk / ↑ / W ile zıpla (basılı tutarsan daha yükseğe), ↓ / S ile eğil. Kristallerin üstünden zıpla, dronların altından eğil, elmasları topla!</p>
  </div>
  <script src="../istatistik.js"></script>
  <script src="../ses.js"></script>
  <script src="runner.js"></script>
</body>
</html>
