<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="nosnippet">
  <title>Yıldız Yakala · sitemiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    main { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding: 0.8rem; }
    .hud { width: min(92vw, 360px); display: flex; justify-content: space-between; font-size: 0.95rem; }
    canvas {
      width: min(92vw, 360px);
      height: auto;
      aspect-ratio: 360 / 540;
      max-height: 78vh;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      background: rgba(5, 8, 25, 0.55);
      touch-action: none;
      cursor: none;
    }
    .hint { margin: 0; font-size: 0.8rem; opacity: 0.7; text-align: center; }
    .back { position: fixed; top: 12px; left: 14px; z-index: 2; font-size: 0.9rem; }
  </style>
</head>
<body>
  <a class="back" href="../">← geri</a>
  <main>
    <div class="hud">
      <span id="score">Puan: 0</span>
      <span id="lives">❤❤❤</span>
      <span id="best">Rekor: 0</span>
    </div>
    <canvas id="c" width="360" height="540"></canvas>
    <p class="hint">Sepeti fare, parmak veya ← → tuşlarıyla hareket ettir. Yıldızları yakala, göktaşlarından kaç!</p>
  </main>

  <script>
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;

    const player = { x: W / 2, w: 74, h: 16, y: H - 46 };
    let state = 'ready';            // ready | play | over
    let score = 0, lives = 3, items = [], spawn = 0, speed = 2;
    const keys = {};

    let best = 0;
    try { best = +localStorage.getItem('yildiz-best') || 0; } catch (e) {}

    const $score = document.getElementById('score');
    const $lives = document.getElementById('lives');
    const $best  = document.getElementById('best');

    function hud() {
      $score.textContent = 'Puan: ' + score;
      $lives.textContent = '❤'.repeat(Math.max(lives, 0)) + '♡'.repeat(Math.max(3 - lives, 0));
      $best.textContent  = 'Rekor: ' + best;
    }

    function reset() {
      score = 0; lives = 3; items = []; spawn = 0; speed = 2;
      player.x = W / 2; state = 'play'; hud();
    }

    function clampX(x) { return Math.max(player.w / 2, Math.min(W - player.w / 2, x)); }
    function pointerX(e) {
      const r = cv.getBoundingClientRect();
      return (e.clientX - r.left) * W / r.width;
    }

    cv.addEventListener('pointermove', e => { player.x = clampX(pointerX(e)); });
    cv.addEventListener('pointerdown', e => {
      player.x = clampX(pointerX(e));
      if (state !== 'play') reset();
    });
    addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') reset();
      if (e.key.startsWith('Arrow')) e.preventDefault();
    });
    addEventListener('keyup', e => { keys[e.key] = false; });

    function gameOver() {
      state = 'over';
      if (score > best) {
        best = score;
        try { localStorage.setItem('yildiz-best', best); } catch (e) {}
      }
      hud();
    }

    function update() {
      if (state !== 'play') return;

      if (keys['ArrowLeft'] || keys['a'])  player.x = clampX(player.x - 6);
      if (keys['ArrowRight'] || keys['d']) player.x = clampX(player.x + 6);

      speed = 2 + score * 0.05;
      spawn--;
      if (spawn <= 0) {
        spawn = Math.max(16, 55 - score * 0.7);
        items.push({
          x: 16 + Math.random() * (W - 32),
          y: -16,
          r: 13,
          bomb: Math.random() < 0.25,
          vy: speed + Math.random() * 1.5
        });
      }

      for (const it of items) {
        it.y += it.vy;
        const hit = it.y + it.r >= player.y &&
                    it.y - it.r <= player.y + player.h &&
                    Math.abs(it.x - player.x) < player.w / 2 + it.r * 0.5;
        if (hit) {
          it.dead = true;
          if (it.bomb) lives--; else score++;
          hud();
        } else if (it.y > H + 20) {
          it.dead = true;
          if (!it.bomb) { lives--; hud(); }
        }
      }
      items = items.filter(i => !i.dead);
      if (lives <= 0) gameOver();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // sepet
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.roundRect(player.x - player.w / 2, player.y, player.w, player.h, 8);
      ctx.fill();

      // düşen nesneler
      ctx.font = '26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const it of items) ctx.fillText(it.bomb ? '☄️' : '⭐', it.x, it.y);

      // mesajlar
      if (state !== 'play') {
        ctx.fillStyle = 'rgba(5, 8, 25, 0.65)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#e8e8f5';
        ctx.font = 'bold 28px system-ui, sans-serif';
        ctx.fillText(state === 'over' ? 'Oyun bitti' : 'Yıldız Yakala', W / 2, H / 2 - 40);
        ctx.font = '18px system-ui, sans-serif';
        if (state === 'over') ctx.fillText('Puan: ' + score, W / 2, H / 2);
        ctx.fillText('Başlamak için dokun / Enter', W / 2, H / 2 + 36);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    hud();
    loop();
  </script>
</body>
</html>
